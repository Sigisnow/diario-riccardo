<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Diario Riccardo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(160deg, #0f0820 0%, #1a0f35 50%, #0a1525 100%);
  font-family: Georgia, serif;
  color: #f0e8ff;
  -webkit-tap-highlight-color: transparent;
}
@keyframes pulse1 { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.15);opacity:1} }
@keyframes fadeIn  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:#4a2a7a;border-radius:2px}

#app { max-width: 500px; margin: 0 auto; padding-bottom: 60px; }

/* HEADER */
#header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  background: rgba(255,255,255,.03);
  display: flex; align-items: center; justify-content: space-between;
}
#header-left .lbl { font-size:11px; letter-spacing:3px; color:#9880c0; text-transform:uppercase; }
#baby-name { font-size:28px; font-weight:700; cursor:pointer; }
#baby-name-input {
  background:transparent; border:none; border-bottom:2px solid #b47fff;
  color:#f0e8ff; font-size:28px; font-family:Georgia,serif;
  font-weight:700; outline:none; width:180px; display:none;
}
#stats-row { display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
.stat-item { text-align:center; }
.stat-icon { font-size:16px; }
.stat-val  { font-size:20px; font-weight:700; line-height:1.1; }
.stat-lbl  { font-size:9px; color:#9880c0; }
.stats-label { font-size:11px; color:#9880c0; letter-spacing:1px; text-align:right; }

/* VOICE */
#voice-area {
  display:flex; flex-direction:column; align-items:center;
  padding:28px 20px 16px;
}
#pulse-wrap { position:relative; width:140px; height:140px; }
#pulse1,#pulse2 {
  position:absolute; inset:0; border-radius:50%;
  background:rgba(100,180,255,.1);
  animation:pulse1 2s ease-in-out infinite; display:none;
}
#pulse2 { inset:10px; animation-delay:.4s; }
#ball {
  position:absolute; inset:20px; border-radius:50%;
  background:linear-gradient(135deg,#3a2a5a,#2a1a4a);
  display:flex; align-items:center; justify-content:center;
  font-size:36px; transition:background .4s ease;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
#status-msg {
  font-size:13px; color:#9880c0; letter-spacing:.5px;
  min-height:20px; transition:color .3s; text-align:center; margin-top:16px;
}
#transcript-box {
  margin-top:10px; padding:8px 14px;
  background:rgba(180,120,255,.1); border-radius:10px;
  font-size:12px; color:#d0c0f0; font-style:italic;
  max-width:320px; line-height:1.5; text-align:center; display:none;
}
#error-box {
  margin-top:8px; padding:6px 12px;
  background:rgba(244,100,100,.1); border-radius:8px;
  font-size:12px; color:#f4a0a0; text-align:center; display:none;
}
#mic-btn {
  margin-top:20px; width:64px; height:64px; border-radius:50%;
  background:linear-gradient(135deg,#b47fff,#7b4fff);
  border:none; cursor:pointer; font-size:26px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 20px rgba(123,79,255,.4);
  transition:all .3s; touch-action:manipulation;
}
#mic-btn:active { transform:scale(.93); }
#mic-hint {
  margin-top:10px; font-size:11px; color:#9880c0;
  text-align:center; line-height:1.8; display:none;
}
#mic-hint strong { color:#c4a7f4; }

/* LOG */
#log-section { padding:0 20px; }
#log-header {
  display:none; justify-content:space-between; align-items:center;
  margin-bottom:16px; padding-top:20px;
  border-top:1px solid rgba(255,255,255,.06);
}
#log-title { font-size:11px; letter-spacing:2px; color:#9880c0; text-transform:uppercase; }
#clear-btn {
  background:none; border:1px solid rgba(255,255,255,.1);
  color:#9880c0; border-radius:8px; padding:4px 10px; font-size:11px; cursor:pointer;
}
.day-label {
  font-size:11px; color:#9880c0; letter-spacing:1px;
  text-transform:capitalize; margin-bottom:8px; margin-top:16px;
}
.entry-card {
  display:flex; align-items:flex-start; gap:12px;
  padding:14px 16px; border-radius:16px;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
  margin-bottom:10px; animation:fadeIn .3s ease;
}
.entry-icon-wrap {
  width:44px; height:44px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:22px;
}
.entry-body { flex:1; min-width:0; }
.entry-top  { display:flex; justify-content:space-between; align-items:flex-start; }
.entry-summary { font-weight:600; color:#f0e8ff; font-size:14px; }
.entry-time    { color:#9880c0; font-size:12px; flex-shrink:0; margin-left:8px; }
.entry-tags    { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.tag { border-radius:6px; padding:2px 8px; font-size:11px; font-weight:600; }
.entry-note { color:#9880c0; font-size:12px; margin-top:4px; }
.del-btn {
  background:none; border:none; color:#9880c0;
  cursor:pointer; padding:4px; font-size:16px; flex-shrink:0; opacity:.5;
  touch-action:manipulation;
}
#empty-msg {
  text-align:center; padding:40px 20px;
  color:#4a3a6a; font-size:14px; line-height:2;
}
#empty-msg em { color:#7a5a9a; }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div id="header-left">
      <div class="lbl">Diario di</div>
      <div id="baby-name">Riccardo ✏️</div>
      <input id="baby-name-input" type="text" value="Riccardo" maxlength="20">
    </div>
    <div>
      <div class="stats-label">OGGI</div>
      <div id="stats-row">
        <div class="stat-item"><div class="stat-icon">🤱</div><div class="stat-val" id="st-seno">0</div><div class="stat-lbl">seno</div></div>
        <div class="stat-item"><div class="stat-icon">🍼</div><div class="stat-val" id="st-bib">0</div><div class="stat-lbl">bib.</div></div>
        <div class="stat-item"><div class="stat-icon">🧷</div><div class="stat-val" id="st-pan">0</div><div class="stat-lbl">pan.</div></div>
      </div>
    </div>
  </div>

  <div id="voice-area">
    <div id="pulse-wrap">
      <div id="pulse1"></div><div id="pulse2"></div>
      <div id="ball">😴</div>
    </div>
    <div id="status-msg">Premi il microfono per iniziare</div>
    <div id="transcript-box"></div>
    <div id="error-box"></div>
    <button id="mic-btn" onclick="toggleMic()">🎙️</button>
    <div id="mic-hint">
      <strong>Ciao app</strong> → inizia registrazione<br>
      <strong>Ciao</strong> / pausa 4s → salva
    </div>
  </div>

  <div id="log-section">
    <div id="log-header">
      <div id="log-title">REGISTRO (<span id="log-count">0</span>)</div>
      <button id="clear-btn" onclick="clearAll()">Cancella tutto</button>
    </div>
    <div id="entries-wrap"></div>
    <div id="empty-msg">Nessun evento ancora.<br>Premi 🎙️ e di' <em>"Ciao app"</em><br>per iniziare.</div>
  </div>
</div>

<script>
// ─── CATEGORIE ───────────────────────────────────────────────
const CAT = {
  seno:      { icon:"🤱", color:"#f4a7b9" },
  biberon:   { icon:"🍼", color:"#a7c4f4" },
  pannolino: { icon:"🧷", color:"#f4d7a7" },
  sonno:     { icon:"😴", color:"#c4a7f4" },
  altro:     { icon:"📝", color:"#a7f4c4" },
};

// ─── PARSER LOCALE ───────────────────────────────────────────
function parseText(raw) {
  const t = raw.toLowerCase();
  const det = { lato:null, durata_minuti:null, ml:null, tipo_pannolino:null, consistenza:null, note:null };
  let categoria = "altro";
  let riassunto = raw.trim().slice(0, 60);

  // LATO
  if (/sinistro|sinistra/.test(t)) det.lato = "sinistro";
  else if (/destro|destra/.test(t)) det.lato = "destro";

  // DURATA
  const mezzora = /mezz[ao]ra/.test(t);
  const quartoOra = /quarto d'ora|quarto ora/.test(t);
  const minMatch = t.match(/(\d+)\s*min/);
  const oreMatch = t.match(/(\d+)\s*or[ae]/);
  if (mezzora) det.durata_minuti = 30;
  else if (quartoOra) det.durata_minuti = 15;
  else if (minMatch) det.durata_minuti = parseInt(minMatch[1]);
  else if (oreMatch) det.durata_minuti = parseInt(oreMatch[1]) * 60;

  // ML
  const mlMatch = t.match(/(\d+)\s*ml/);
  if (mlMatch) det.ml = parseInt(mlMatch[1]);

  // CATEGORIA: SENO
  if (/seno|allatt|tetta|poppa/.test(t)) {
    categoria = "seno";
    const lato = det.lato ? ` ${det.lato}` : "";
    const dur = det.durata_minuti ? ` per ${det.durata_minuti} min` : "";
    riassunto = `Allattamento al seno${lato}${dur}`;
  }
  // CATEGORIA: BIBERON
  else if (/biberon|biberone|latte|formula|artificiale/.test(t)) {
    categoria = "biberon";
    const ml = det.ml ? ` ${det.ml} ml` : "";
    riassunto = `Biberon${ml}`;
  }
  // CATEGORIA: PANNOLINO
  else if (/pannolino|pannolin|cacca|pipì|pipi|feci|scarica/.test(t)) {
    categoria = "pannolino";
    if (/cacca|feci|scarica/.test(t)) {
      det.tipo_pannolino = "cacca";
      // CONSISTENZA
      if (/liquid[ao]/.test(t)) det.consistenza = "liquida";
      else if (/molle|morbid/.test(t)) det.consistenza = "morbida";
      else if (/dur[ao]|solida/.test(t)) det.consistenza = "dura";
      else if (/esplos/.test(t)) det.consistenza = "esplosiva";
      else if (/granul|granel/.test(t)) det.consistenza = "granulosa";
      const cons = det.consistenza ? ` ${det.consistenza}` : "";
      riassunto = `Cacca${cons}`;
    } else if (/pipì|pipi|urin/.test(t)) {
      det.tipo_pannolino = "pipì";
      riassunto = "Pipì";
    } else {
      det.tipo_pannolino = "misto";
      riassunto = "Pannolino misto";
    }
  }
  // CATEGORIA: SONNO
  else if (/dorm|addorment|nanna|riposo|sveglia|si è svegliato/.test(t)) {
    categoria = "sonno";
    if (/sveglia|si è svegliato|si è svegliata/.test(t)) {
      riassunto = "Si è svegliato";
    } else {
      const dur = det.durata_minuti ? ` (${det.durata_minuti} min)` : "";
      riassunto = `Si è addormentato${dur}`;
    }
  }

  return { categoria, riassunto, dettagli: det };
}

// ─── STATO APP ───────────────────────────────────────────────
let entries = [];
let listening = false;
let activeRec = false;
let processing = false;
let recognition = null;
let buffer = "";
let endTimer = null;

const WAKE = ["ciao app","hey app","ok app","ciao elena"];
const END  = ["ciao","fine","ok fatto","stop","basta"];

// ─── PERSIST ─────────────────────────────────────────────────
function load() {
  try { entries = JSON.parse(localStorage.getItem("baby_entries") || "[]"); } catch(e){}
  const name = localStorage.getItem("baby_name");
  if (name) {
    document.getElementById("baby-name").textContent = name + " ✏️";
    document.getElementById("baby-name-input").value = name;
  }
}
function save() { localStorage.setItem("baby_entries", JSON.stringify(entries)); }

// ─── NOME ─────────────────────────────────────────────────────
document.getElementById("baby-name").addEventListener("click", function() {
  this.style.display = "none";
  const i = document.getElementById("baby-name-input");
  i.style.display = "block"; i.focus();
});
document.getElementById("baby-name-input").addEventListener("blur", saveName);
document.getElementById("baby-name-input").addEventListener("keydown", e => { if(e.key==="Enter") e.target.blur(); });
function saveName() {
  const val = document.getElementById("baby-name-input").value.trim() || "Bambino";
  localStorage.setItem("baby_name", val);
  document.getElementById("baby-name").textContent = val + " ✏️";
  document.getElementById("baby-name").style.display = "block";
  document.getElementById("baby-name-input").style.display = "none";
}

// ─── UI ───────────────────────────────────────────────────────
function setStatus(msg, color) {
  const el = document.getElementById("status-msg");
  el.textContent = msg; el.style.color = color || "#9880c0";
}
function setTranscript(t) {
  const el = document.getElementById("transcript-box");
  if (t) { el.style.display = "block"; el.textContent = "…" + t.slice(-120); }
  else el.style.display = "none";
}
function setError(msg) {
  const el = document.getElementById("error-box");
  if (msg) { el.style.display = "block"; el.textContent = msg; }
  else el.style.display = "none";
}
function setBall(state) {
  const ball = document.getElementById("ball");
  const p1 = document.getElementById("pulse1");
  const p2 = document.getElementById("pulse2");
  const btn = document.getElementById("mic-btn");
  const hint = document.getElementById("mic-hint");
  const states = {
    idle:       { emoji:"😴", bg:"linear-gradient(135deg,#3a2a5a,#2a1a4a)", shadow:"0 4px 20px rgba(0,0,0,.4)", pulse:false, btnBg:"linear-gradient(135deg,#b47fff,#7b4fff)", btnIcon:"🎙️", hint:false },
    listening:  { emoji:"👂", bg:"linear-gradient(135deg,#4fc3f7,#0288d1)", shadow:"0 0 30px rgba(100,180,255,.4)", pulse:true, pulseC:"rgba(100,180,255,.1)", btnBg:"linear-gradient(135deg,#ff6b6b,#c0392b)", btnIcon:"⏹", hint:true },
    active:     { emoji:"🎙️", bg:"linear-gradient(135deg,#b47fff,#7b4fff)", shadow:"0 0 40px rgba(180,120,255,.5)", pulse:true, pulseC:"rgba(180,120,255,.15)", btnBg:"linear-gradient(135deg,#ff6b6b,#c0392b)", btnIcon:"⏹", hint:true },
    processing: { emoji:"⏳", bg:"linear-gradient(135deg,#f4a7b9,#a7c4f4)", shadow:"0 0 20px rgba(200,150,255,.3)", pulse:false, btnBg:"linear-gradient(135deg,#b47fff,#7b4fff)", btnIcon:"⏳", hint:false },
  };
  const s = states[state];
  ball.textContent = s.emoji;
  ball.style.background = s.bg;
  ball.style.boxShadow = s.shadow;
  p1.style.display = p2.style.display = s.pulse ? "block" : "none";
  if (s.pulse) { p1.style.background = p2.style.background = s.pulseC; }
  btn.style.background = s.btnBg;
  btn.textContent = s.btnIcon;
  hint.style.display = s.hint ? "block" : "none";
}

// ─── PROCESS ─────────────────────────────────────────────────
function processBuffer(text) {
  if (!text.trim()) return;
  clearTimeout(endTimer);
  activeRec = false; processing = true; buffer = "";
  setBall("processing");
  setStatus("Sto elaborando...", "#c4a7f4");
  setTranscript("");

  const parsed = parseText(text);
  const entry = { id: Date.now(), timestamp: new Date().toISOString(), trascrizione: text, ...parsed };
  entries.unshift(entry);
  save(); renderEntries();
  setStatus("✓ " + parsed.riassunto, "#a7f4c4");
  processing = false;

  setTimeout(() => {
    if (listening) { setBall("listening"); setStatus("In ascolto per 'Ciao app'...", "#a7c4f4"); }
    else setBall("idle");
  }, 2000);
}

// ─── MICROFONO ───────────────────────────────────────────────
function toggleMic() {
  if (listening) stopListening(); else startListening();
}
function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setError("Usa Chrome su Android."); return; }
  setError("");
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "it-IT";

  recognition.onresult = function(event) {
    let interim = "", finalText = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript.toLowerCase().trim();
      if (event.results[i].isFinal) finalText += " " + t;
      else interim = t;
    }
    const combined = (buffer + " " + finalText).trim();
    setTranscript(combined || interim);

    if (!activeRec) {
      if (WAKE.some(w => (combined||interim).includes(w))) {
        activeRec = true; buffer = "";
        setBall("active");
        setStatus("Ascoltando… di' 'Ciao' per salvare", "#c4a7f4");
      }
    } else {
      if (END.some(w => finalText.trim().startsWith(w))) {
        processBuffer(buffer); return;
      }
      buffer = combined;
      clearTimeout(endTimer);
      endTimer = setTimeout(() => { if (activeRec && buffer.trim()) processBuffer(buffer); }, 4000);
    }
  };

  recognition.onerror = function(e) {
    if (e.error === "no-speech") return;
    if (e.error === "not-allowed") {
      setError("Abilita il microfono nelle impostazioni di Chrome.");
      stopListening(); return;
    }
    setError("Errore microfono: " + e.error);
  };

  recognition.onend = function() {
    if (listening && !processing) setTimeout(() => { try{ recognition.start(); }catch(e){} }, 300);
  };

  recognition.start();
  listening = true;
  setBall("listening");
  setStatus("In ascolto per 'Ciao app'...", "#a7c4f4");
}
function stopListening() {
  clearTimeout(endTimer);
  try { recognition.stop(); } catch(e){}
  listening = false; activeRec = false; buffer = "";
  setBall("idle"); setStatus("Premi il microfono per iniziare"); setTranscript("");
}

// ─── RENDER ──────────────────────────────────────────────────
function ft(iso) { return new Date(iso).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
function fd(iso) { return new Date(iso).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}); }

function renderEntries() {
  const wrap  = document.getElementById("entries-wrap");
  const empty = document.getElementById("empty-msg");
  const hdr   = document.getElementById("log-header");
  document.getElementById("log-count").textContent = entries.length;

  if (!entries.length) { wrap.innerHTML=""; empty.style.display="block"; hdr.style.display="none"; return; }
  empty.style.display = "none"; hdr.style.display = "flex";

  const todayStr = new Date().toDateString();
  const today = entries.filter(e => new Date(e.timestamp).toDateString() === todayStr);
  document.getElementById("st-seno").textContent = today.filter(e=>e.categoria==="seno").length;
  document.getElementById("st-bib").textContent  = today.filter(e=>e.categoria==="biberon").length;
  document.getElementById("st-pan").textContent  = today.filter(e=>e.categoria==="pannolino").length;

  const groups = {};
  entries.forEach(e => { const d=new Date(e.timestamp).toDateString(); if(!groups[d])groups[d]=[]; groups[d].push(e); });

  let html = "";
  Object.entries(groups).forEach(([,dayE]) => {
    html += `<div class="day-label">${fd(dayE[0].timestamp)}</div>`;
    dayE.forEach(e => {
      const cat = CAT[e.categoria] || CAT.altro;
      const d = e.dettagli || {};
      const tags = [d.lato, d.durata_minuti&&d.durata_minuti+"min", d.ml&&d.ml+"ml", d.tipo_pannolino, d.consistenza].filter(Boolean);
      html += `<div class="entry-card">
        <div class="entry-icon-wrap" style="background:${cat.color}30;border:1.5px solid ${cat.color}60">${cat.icon}</div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="entry-summary">${e.riassunto||e.trascrizione}</span>
            <span class="entry-time">${ft(e.timestamp)}</span>
          </div>
          ${tags.length?`<div class="entry-tags">${tags.map(t=>`<span class="tag" style="background:${cat.color}25;color:${cat.color}">${t}</span>`).join("")}</div>`:""}
          ${d.note?`<div class="entry-note">${d.note}</div>`:""}
        </div>
        <button class="del-btn" onclick="deleteEntry(${e.id})">✕</button>
      </div>`;
    });
  });
  wrap.innerHTML = html;
}
function deleteEntry(id) { entries=entries.filter(e=>e.id!==id); save(); renderEntries(); }
function clearAll() { if(confirm("Cancellare tutto?")){ entries=[]; save(); renderEntries(); ["st-seno","st-bib","st-pan"].forEach(id=>document.getElementById(id).textContent="0"); } }

load(); renderEntries();
</script>
</body>
</html>
